<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Aqua — подтверждение</title>
  <style>
    :root{
      --bg:#0b0c1a; --panel:#171933; --panel-hi:#1f2247; --stroke:#2a2e57; --stroke-hi:#3a3f74;
      --text:#eef0ff; --muted:#9aa0c7; --accent:#6366f1; --accent2:#22d3ee; --ok:#34d399; --danger:#fb7185;
      --grad:linear-gradient(135deg,#6366f1,#22d3ee); --drop:#22d3ee;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);
      background:
        radial-gradient(1000px 620px at 12% -10%,rgba(99,102,241,.28),transparent 55%),
        radial-gradient(900px 640px at 108% 8%,rgba(34,211,238,.20),transparent 52%),
        var(--bg);
      display:grid;place-items:center;padding:24px;min-height:100%;
    }
    .card{
      position:relative;width:min(430px,94vw);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01)),var(--panel);
      border:1px solid var(--stroke);border-radius:26px;padding:38px 30px 30px;text-align:center;
      box-shadow:0 40px 90px -30px rgba(0,0,0,.7),0 0 60px -30px var(--accent);
      animation:cardIn .5s cubic-bezier(.22,1,.36,1) both;overflow:hidden;
    }
    .card::before{content:"";position:absolute;top:-40%;left:50%;width:70%;height:70%;transform:translateX(-50%);
      background:radial-gradient(circle,rgba(99,102,241,.35),transparent 65%);filter:blur(10px);pointer-events:none}
    .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;position:relative}
    .brand svg{width:26px;height:32px;fill:var(--drop);filter:drop-shadow(0 6px 12px rgba(34,211,238,.5))}
    .brand b{font-size:20px;font-weight:800;letter-spacing:-.02em}
    .glyph{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;position:relative;
      background:var(--panel-hi);border:1px solid var(--stroke-hi);transition:.35s}
    .g-svg{width:38px;height:38px;fill:none;stroke:var(--text);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .is-ok .glyph{background:linear-gradient(135deg,rgba(52,211,153,.25),rgba(34,211,238,.14));border-color:rgba(52,211,153,.5);animation:pop .5s var(--ease) both}
    .is-ok .g-svg{stroke:var(--ok);stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .15s forwards}
    .is-error .glyph{background:linear-gradient(135deg,rgba(251,113,133,.22),rgba(251,113,133,.08));border-color:rgba(251,113,133,.5)}
    .is-error .g-svg{stroke:var(--danger)}
    h1{font-size:23px;font-weight:800;margin:0 0 8px;letter-spacing:-.02em}
    #msg{font-size:14.5px;color:var(--muted);line-height:1.55;margin:0 auto;max-width:330px}
    #msg b{color:var(--text)}
    #form{margin-top:20px;display:flex;flex-direction:column;gap:10px;text-align:left}
    #form:empty{margin:0}
    .field input{width:100%;background:var(--panel-hi);border:1px solid var(--stroke);border-radius:12px;
      padding:12px 14px;color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:.2s}
    .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
    .err{color:var(--danger);font-size:13px;min-height:2px}
    .err:empty{display:none}
    .btn{border:0;border-radius:12px;padding:13px 18px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;
      color:#fff;background:var(--grad);box-shadow:0 14px 30px -12px rgba(99,102,241,.9);transition:transform .12s,box-shadow .2s;width:100%}
    .btn:hover{transform:translateY(-1px)}
    .btn:active{transform:translateY(0) scale(.99)}
    .btn:disabled{opacity:.6;cursor:default}
    .btn.ghost{background:transparent;border:1px solid var(--stroke-hi);color:var(--text);box-shadow:none;margin-top:14px}
    .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--stroke-hi);border-top-color:var(--accent);animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
    @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
    @keyframes draw{to{stroke-dashoffset:0}}
    :root{--ease:cubic-bezier(.22,1,.36,1)}
  </style>
</head>
<body>
  <div class="card is-loading" id="card">
    <div class="brand">
      <svg viewBox="0 0 24 30" aria-hidden="true"><path d="M12 0S2 11 2 19a10 10 0 0 0 20 0C22 11 12 0 12 0z"/></svg>
      <b>Aqua</b>
    </div>
    <div class="glyph" id="glyph"><span class="spinner"></span></div>
    <h1 id="title">Секундочку…</h1>
    <div id="msg">Проверяем ссылку из письма.</div>
    <div id="form"></div>
    <button class="btn ghost" id="openApp" hidden>Открыть приложение</button>
  </div>
  <script src="vendor/firebase-app-compat.js"></script>
  <script src="vendor/firebase-auth-compat.js"></script>
  <script src="auth.js"></script>
</body>
</html>
